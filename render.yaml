services:
  - type: web
    name: bellezea-elections
    runtime: static
    buildCommand: ""
    staticPublishPath: web
    routes:
      - type: rewrite
        source: /officer
        destination: /index.html
      - type: rewrite
        source: /voter
        destination: /index.html

  - type: web
    name: bellezea-elections-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "python scripts/regression_tests.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bellezea-elections-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: OFFICER_EMAIL
        value: bellezea.elections@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: bellezea-elections-db
    databaseName: bellezea_elections
    user: bellezea_elections
