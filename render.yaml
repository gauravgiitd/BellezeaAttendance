services:
  - type: web
    name: nambiar-bellezea-attendance
    runtime: static
    buildCommand: ""
    staticPublishPath: web

  - type: web
    name: nambiar-bellezea-election-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nambiar-bellezea-election-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: nambiar-bellezea-election-db
    databaseName: bellezea_elections
    user: bellezea_elections
