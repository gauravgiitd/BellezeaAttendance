services:
  - type: web
    name: bellezea-elections
    runtime: static
    buildCommand: ""
    staticPublishPath: web
    routes:
      - type: rewrite
        source: /officer
        destination: /index.html
      - type: rewrite
        source: /voter
        destination: /index.html

  - type: web
    name: bellezea-elections-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "python -c \"from backend.app.db import initialize_schema; initialize_schema()\""
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bellezea-elections-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "false"
      - key: SCHEMA_LOCK_TIMEOUT
        value: "30s"
      - key: CORS_ORIGINS
        value: "*"
      - key: OFFICER_EMAIL
        value: bellezea.elections@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_OAUTH_CLIENT_SECRET
        sync: false
      - key: RESIDENT_MASTER_CSV_URL
        sync: false
      - key: ELECTION_BACKUP_DRIVE_FOLDER_ID
        sync: false

databases:
  - name: bellezea-elections-db
    databaseName: bellezea_elections
    user: bellezea_elections
